[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mbstring",
    "php82Extensions.openssl",
    "php82Extensions.curl",
    "php82Extensions.xml",
    "php82Extensions.tokenizer",
    "php82Extensions.ctype",
    "php82Extensions.iconv",
    "php82Extensions.sodium",
    "php82Extensions.intl",
    "php82Extensions.fileinfo",
    "php82Extensions.mongodb"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-scripts"
]

[phases.build]
cmds = [
    "php bin/console cache:clear --env=prod --no-debug",
    "php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration || true",
    "php bin/console lexik:jwt:generate-keypair --skip-if-exists || true"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t public"